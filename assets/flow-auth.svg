<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 380" role="img"
     aria-label="로그인과 지갑 생성 — 앱, Dynamic, 백엔드, 지갑 바인딩 4단계 흐름">
  <defs>
    <style>
      :root{
        --ink:#0f172a; --muted:#64748b; --card:#ffffff; --line:#e2e8f0;
        --line2:#cbd5e1; --tint:#f5f7fb; --blue:#2F6BF3; --warn:#DC2626; --svgbg:#ffffff;
      }
      @media (prefers-color-scheme: dark){
        :root{
          --ink:#f1f5f9; --muted:#94a3b8; --card:#1a2540; --line:#2c3a5c;
          --line2:#47598a; --tint:#141e35; --blue:#7cb0ff; --warn:#fca5a5; --svgbg:#111a2e;
        }
      }
    </style>
    <style>
      .lbl   { font: 600 14px 'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif; fill: var(--ink, #0f172a); }
      .sub   { font: 400 11.5px 'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif; fill: var(--muted, #64748b); }
      .step  { font: 700 12px 'Pretendard',sans-serif; fill: #fff; }
      .note  { font: 400 12px 'Pretendard','Apple SD Gothic Neo',sans-serif; fill: var(--muted, #64748b); }
      .keyn  { font: 600 12px 'Pretendard','Apple SD Gothic Neo',sans-serif; fill: var(--blue, #2F6BF3); }
      .card  { fill: var(--card, #fff); stroke: var(--line, #e2e8f0); stroke-width: 1.5; }
      .flow  { stroke: var(--line2, #cbd5e1); stroke-width: 2; fill: none; }
    </style>
    <marker id="ar2" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto">
      <path d="M0 1 L8 4.5 L0 8 z" fill="var(--line2, #cbd5e1)"/>
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="var(--svgbg)"/>

  <!-- 연결선 -->
  <path class="flow" marker-end="url(#ar2)" d="M176 118 H236"/>
  <path class="flow" marker-end="url(#ar2)" d="M396 118 H456"/>
  <path class="flow" marker-end="url(#ar2)" d="M616 118 H676"/>

  <!-- 1. 앱 -->
  <rect class="card" x="16" y="44" width="160" height="148" rx="14"/>
  <circle cx="44" cy="70" r="11" fill="#2F6BF3"/><text class="step" x="44" y="74" text-anchor="middle">1</text>
  <text class="lbl" x="64" y="75">앱</text>
  <text class="sub" x="32" y="104">"구글로 계속하기"</text>
  <text class="sub" x="32" y="122">버튼 한 번</text>
  <text class="keyn" x="32" y="148">유저는 지갑이</text>
  <text class="keyn" x="32" y="164">생기는 걸 모른다</text>

  <!-- 2. Dynamic -->
  <rect class="card" x="236" y="44" width="160" height="148" rx="14"/>
  <circle cx="264" cy="70" r="11" fill="#2F6BF3"/><text class="step" x="264" y="74" text-anchor="middle">2</text>
  <text class="lbl" x="284" y="75">Dynamic</text>
  <text class="sub" x="252" y="104">구글 OAuth</text>
  <text class="keyn" x="252" y="126">TSS-MPC 지갑</text>
  <text class="sub" x="252" y="142">생성 또는 복구</text>
  <text class="sub" x="252" y="166">share 분산 보관</text>
  <text class="sub" x="252" y="182">→ JWT 발급</text>

  <!-- 3. 백엔드 -->
  <rect class="card" x="456" y="44" width="160" height="148" rx="14"/>
  <circle cx="484" cy="70" r="11" fill="#FDB022"/><text class="step" x="484" y="74" text-anchor="middle">3</text>
  <text class="lbl" x="504" y="75">백엔드</text>
  <text class="sub" x="472" y="104">JWKS로 JWT 검증</text>
  <text class="sub" x="472" y="122">iss · exp · 서명</text>
  <text class="sub" x="472" y="146">sub 로 유저 UPSERT</text>
  <text class="keyn" x="472" y="170">자체 세션 JWT 발급</text>

  <!-- 4. 지갑 바인딩 -->
  <rect class="card" x="676" y="44" width="160" height="148" rx="14"/>
  <circle cx="704" cy="70" r="11" fill="#12B76A"/><text class="step" x="704" y="74" text-anchor="middle">4</text>
  <text class="lbl" x="724" y="75">지갑 바인딩</text>
  <text class="sub" x="692" y="104">챌린지를 앱이 서명</text>
  <text class="sub" x="692" y="126">서버가 서명에서</text>
  <text class="sub" x="692" y="142">주소를 복구·대조</text>
  <text class="keyn" x="692" y="168">주소만 저장</text>

  <!-- 우측 주석 -->
  <text class="note" x="964" y="128" text-anchor="end">서버에 이미</text>
  <text class="note" x="964" y="146" text-anchor="end">주소가 있으면</text>
  <text class="note" x="964" y="164" text-anchor="end">대조만 하고 끝</text>

  <!-- 하단 핵심 메모 -->
  <rect x="16" y="228" width="948" height="116" rx="12"
        fill="var(--tint, #f1f5f9)" stroke="var(--line, #e2e8f0)" stroke-width="1.5"/>
  <text class="lbl" x="36" y="256">이 흐름의 핵심 세 가지</text>
  <text class="note" x="36" y="282">· 서버는 주소만 안다 — 스키마에 개인키 컬럼 자체가 없다</text>
  <text class="note" x="36" y="304">· 키는 share 로 쪼개져 있고, 서명할 때도 한 곳에서 조립되지 않는다</text>
  <text class="note" x="36" y="326">· 같은 구글 계정이면 재설치·기기 교체 뒤에도 같은 주소가 복구된다</text>
</svg>
