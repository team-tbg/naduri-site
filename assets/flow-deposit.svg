<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 380" role="img"
     aria-label="포인트가 유동성 풀에 도착하기까지 — 앱, 백엔드, 릴레이어, 볼트, 풀 5단계 흐름">
  <defs>
    <style>
      :root{
        --ink:#0f172a; --muted:#64748b; --card:#ffffff; --line:#e2e8f0;
        --line2:#cbd5e1; --tint:#f5f7fb; --blue:#2F6BF3; --warn:#DC2626; --svgbg:#ffffff;
      }
      @media (prefers-color-scheme: dark){
        :root{
          --ink:#f1f5f9; --muted:#94a3b8; --card:#1a2540; --line:#2c3a5c;
          --line2:#47598a; --tint:#141e35; --blue:#7cb0ff; --warn:#fca5a5; --svgbg:#111a2e;
        }
      }
    </style>
    <style>
      .lbl   { font: 600 14px 'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif; fill: var(--ink, #0f172a); }
      .sub   { font: 400 11.5px 'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif; fill: var(--muted, #64748b); }
      .step  { font: 700 12px 'Pretendard',sans-serif; fill: #fff; }
      .note  { font: 400 12px 'Pretendard','Apple SD Gothic Neo',sans-serif; fill: var(--muted, #64748b); }
      .keyn  { font: 600 12px 'Pretendard','Apple SD Gothic Neo',sans-serif; fill: var(--blue, #2F6BF3); }
      .card  { fill: var(--card, #fff); stroke: var(--line, #e2e8f0); stroke-width: 1.5; }
      .flow  { stroke: var(--line2, #cbd5e1); stroke-width: 2; fill: none; }
    </style>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto">
      <path d="M0 1 L8 4.5 L0 8 z" fill="var(--line2, #cbd5e1)"/>
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="var(--svgbg)"/>

  <!-- 연결선 -->
  <path class="flow" marker-end="url(#ar)" d="M176 108 H236"/>
  <path class="flow" marker-end="url(#ar)" d="M396 108 H456"/>
  <path class="flow" marker-end="url(#ar)" d="M616 108 H676"/>
  <path class="flow" marker-end="url(#ar)" d="M836 108 H880 V196 H836"/>

  <!-- 1. 앱 -->
  <rect class="card" x="16" y="56" width="160" height="104" rx="14"/>
  <circle cx="44" cy="82" r="11" fill="#2F6BF3"/><text class="step" x="44" y="86" text-anchor="middle">1</text>
  <text class="lbl" x="64" y="87">앱</text>
  <text class="sub" x="32" y="112">"5,000P 저금하기"</text>
  <text class="sub" x="32" y="130">버튼 한 번</text>
  <text class="sub" x="32" y="148">체인은 보이지 않음</text>

  <!-- 2. 백엔드 -->
  <rect class="card" x="236" y="40" width="160" height="136" rx="14"/>
  <circle cx="264" cy="66" r="11" fill="#2F6BF3"/><text class="step" x="264" y="70" text-anchor="middle">2</text>
  <text class="lbl" x="284" y="71">백엔드</text>
  <text class="sub" x="252" y="96">잔액 확인</text>
  <text class="keyn" x="252" y="116">5,000P → 5,000,000</text>
  <text class="sub" x="252" y="132">units 환산</text>
  <text class="sub" x="252" y="152">서명 요청 페이로드</text>
  <text class="keyn" x="252" y="168">서명은 앱이 한다</text>

  <!-- 3. 릴레이어 -->
  <rect class="card" x="456" y="40" width="160" height="136" rx="14"/>
  <circle cx="484" cy="66" r="11" fill="#FDB022"/><text class="step" x="484" y="70" text-anchor="middle">3</text>
  <text class="lbl" x="504" y="71">릴레이어</text>
  <text class="keyn" x="472" y="96">USDC / USDT</text>
  <text class="sub" x="472" y="112">반반 조달 + approve</text>
  <text class="sub" x="472" y="140">가스를 대신 낸다</text>
  <text class="sub" x="472" y="156">→ 유저 ETH 0원</text>

  <!-- 4. 볼트 -->
  <rect class="card" x="676" y="40" width="160" height="136" rx="14"/>
  <circle cx="704" cy="66" r="11" fill="#12B76A"/><text class="step" x="704" y="70" text-anchor="middle">4</text>
  <text class="lbl" x="724" y="71">NaduriVault</text>
  <text class="sub" x="692" y="96">depositFor()</text>
  <text class="keyn" x="692" y="118">지분(share) 발행</text>
  <text class="sub" x="692" y="134">→ 유저 주소로</text>
  <text class="sub" x="692" y="158">전송 불가 토큰</text>

  <!-- 5. 풀 -->
  <rect class="card" x="676" y="196" width="160" height="120" rx="14"/>
  <circle cx="704" cy="222" r="11" fill="#12B76A"/><text class="step" x="704" y="226" text-anchor="middle">5</text>
  <text class="lbl" x="724" y="227">Uniswap v4 풀</text>
  <text class="sub" x="692" y="252">USDC / USDT</text>
  <text class="sub" x="692" y="270">스테이블 페어</text>
  <text class="keyn" x="692" y="294">IL 거의 없음</text>

  <!-- 유휴→투입 주석 -->
  <text class="note" x="972" y="152" text-anchor="end">키퍼가</text>
  <text class="note" x="972" y="170" text-anchor="end">deployLiquidity</text>

  <!-- 하단 핵심 메모 -->
  <rect x="16" y="216" width="600" height="100" rx="12"
        fill="var(--tint, #f1f5f9)" stroke="var(--line, #e2e8f0)" stroke-width="1.5"/>
  <text class="lbl" x="36" y="244">이 흐름의 핵심 세 가지</text>
  <text class="note" x="36" y="268">· 온체인이 성공한 뒤에 포인트를 차감한다 — 체인이 실패하면 포인트가 남는다</text>
  <text class="note" x="36" y="288">· 서명은 앱이 한다 — 서버에는 서명할 키가 없고 주소만 안다</text>
  <text class="note" x="36" y="308">· 예치는 유휴로 받고 레인지 투입은 따로 — 가스·슬리피지를 유저에게 넘기지 않는다</text>
</svg>
