<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 520" role="img"
     aria-label="나드리 아키텍처 — 앱, 백엔드, GIWA 체인 3층 구조">
  <defs>
    <style>
      :root{
        --ink:#0f172a; --muted:#64748b; --card:#ffffff; --line:#e2e8f0;
        --line2:#cbd5e1; --tint:#f5f7fb; --blue:#2F6BF3; --warn:#DC2626; --svgbg:#ffffff;
      }
      @media (prefers-color-scheme: dark){
        :root{
          --ink:#f1f5f9; --muted:#94a3b8; --card:#1a2540; --line:#2c3a5c;
          --line2:#47598a; --tint:#141e35; --blue:#7cb0ff; --warn:#fca5a5; --svgbg:#111a2e;
        }
      }
    </style>
    <style>
      .layer  { font: 700 15px 'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif; fill: var(--ink,#0f172a); }
      .who    { font: 400 12px 'Pretendard','Apple SD Gothic Neo',sans-serif; fill: var(--muted,#64748b); }
      .chip   { font: 600 12.5px 'Pretendard','Apple SD Gothic Neo',sans-serif; fill: var(--ink,#0f172a); }
      .chipd  { font: 400 11px 'Pretendard','Apple SD Gothic Neo',sans-serif; fill: var(--muted,#64748b); }
      .own    { font: 600 11.5px 'Pretendard','Apple SD Gothic Neo',sans-serif; }
      .panel  { fill: var(--tint,#f8fafc); stroke: var(--line,#e2e8f0); stroke-width: 1.5; }
      .box    { fill: var(--card,#fff); stroke: var(--line,#e2e8f0); stroke-width: 1.5; }
      .link   { stroke: var(--line2,#cbd5e1); stroke-width: 2; fill: none; }
    </style>
    <marker id="a2" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto">
      <path d="M0 1 L8 4.5 L0 8 z" fill="var(--line2,#cbd5e1)"/>
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="var(--svgbg)"/>

  <!-- ── 앱 ── -->
  <rect class="panel" x="16" y="16" width="948" height="118" rx="16"/>
  <rect x="16" y="16" width="5" height="118" rx="2.5" fill="#2F6BF3"/>
  <text class="layer" x="40" y="44">앱 — Expo / React Native (Android)</text>
  <text class="who" x="40" y="64">소유: 걸음 측정 · 화면 · 세션 토큰   /   소유하지 않음: 잔액의 진실</text>

  <rect class="box" x="40" y="76" width="200" height="44" rx="10"/>
  <text class="chip" x="56" y="96">만보기</text>
  <text class="chipd" x="56" y="112">하드웨어 센서 → 가속도계 폴백</text>

  <rect class="box" x="256" y="76" width="240" height="44" rx="10"/>
  <text class="chip" x="272" y="96">화면 12개</text>
  <text class="chipd" x="272" y="112">홈 · 혜택 · 이자받기 · 샵 · 지갑 · 내정보</text>

  <rect class="box" x="512" y="76" width="180" height="44" rx="10"/>
  <text class="chip" x="528" y="96">SecureStore</text>
  <text class="chipd" x="528" y="112">세션 토큰 보관</text>

  <rect class="box" x="708" y="76" width="200" height="44" rx="10"/>
  <text class="chip" x="724" y="96">Google 로그인</text>
  <text class="chipd" x="724" y="112">네이티브 SDK</text>

  <path class="link" marker-end="url(#a2)" d="M490 134 V166"/>
  <text class="chipd" x="500" y="154">HTTPS · Bearer</text>

  <!-- ── 백엔드 ── -->
  <rect class="panel" x="16" y="166" width="948" height="164" rx="16"/>
  <rect x="16" y="166" width="5" height="164" rx="2.5" fill="#2F6BF3"/>
  <text class="layer" x="40" y="194">백엔드 — FastAPI / Python</text>
  <text class="who" x="40" y="214">소유: 유저 신원 · 포인트/원화 원장 · 온체인 호출   /   <tspan class="own" fill="var(--warn)">소유하지 않음: 저금 잔고 (체인이 원장)</tspan></text>

  <rect class="box" x="40" y="228" width="172" height="44" rx="10"/>
  <text class="chip" x="56" y="248">auth</text>
  <text class="chipd" x="56" y="264">id_token 직접 검증 · 세션 JWT</text>

  <rect class="box" x="228" y="228" width="172" height="44" rx="10"/>
  <text class="chip" x="244" y="248">points · cash</text>
  <text class="chipd" x="244" y="264">append-only 원장</text>

  <rect class="box" x="416" y="228" width="172" height="44" rx="10"/>
  <text class="chip" x="432" y="248">steps · rewards</text>
  <text class="chipd" x="432" y="264">하루 1회 · 일일 한도</text>

  <rect class="box" x="604" y="228" width="150" height="44" rx="10"/>
  <text class="chip" x="620" y="248">savings</text>
  <text class="chipd" x="620" y="264">트랙별 지분 회계</text>

  <rect class="box" x="770" y="228" width="138" height="44" rx="10"/>
  <text class="chip" x="786" y="248">wallet</text>
  <text class="chipd" x="786" y="264">주소만 보관</text>

  <rect class="box" x="40" y="284" width="360" height="34" rx="10"/>
  <text class="chip" x="56" y="306">PostgreSQL — 잔액은 저장하지 않고 Σdelta 로 유도</text>

  <rect class="box" x="416" y="284" width="492" height="34" rx="10"/>
  <text class="chip" x="432" y="306">onchain gateway — 체인 접점은 여기 하나뿐 (테스트는 가짜 주입 → 네트워크 없이 검증)</text>

  <path class="link" marker-end="url(#a2)" d="M660 330 V362"/>
  <text class="chipd" x="670" y="350">릴레이어가 가스 대납</text>

  <!-- ── 체인 ── -->
  <rect class="panel" x="16" y="362" width="948" height="142" rx="16"/>
  <rect x="16" y="362" width="5" height="142" rx="2.5" fill="#12B76A"/>
  <text class="layer" x="40" y="390">GIWA 체인 — OP Stack L2 (chainId 91342)</text>
  <text class="who" x="40" y="410">소유: 저금 지분과 그 가치   /   소유하지 않음: 포인트 — 컨트랙트는 포인트를 모른다</text>

  <rect class="box" x="40" y="424" width="188" height="60" rx="10"/>
  <text class="chip" x="56" y="446">릴레이어 지갑</text>
  <text class="chipd" x="56" y="462">유저 대신 tx 제출</text>
  <text class="chipd" x="56" y="476">가스 전액 부담</text>

  <rect class="box" x="244" y="424" width="240" height="60" rx="10" stroke="#12B76A" stroke-width="2"/>
  <text class="chip" x="260" y="446">NaduriVault</text>
  <text class="chipd" x="260" y="462">ERC-4626 지분 · 전송 불가</text>
  <text class="chipd" x="260" y="476">deposit / withdraw / harvest</text>

  <rect class="box" x="500" y="424" width="212" height="60" rx="10"/>
  <text class="chip" x="516" y="446">Uniswap v4 풀</text>
  <text class="chipd" x="516" y="462">USDC / USDT 스테이블</text>
  <text class="chipd" x="516" y="476">fee 1% · tick 3~9</text>

  <rect class="box" x="728" y="424" width="180" height="60" rx="10"/>
  <text class="chip" x="744" y="446">FeeSplitter</text>
  <text class="chipd" x="744" y="462">프로토콜 수수료</text>
  <text class="chipd" x="744" y="476">나드리 / 파트너 5:5</text>
</svg>
